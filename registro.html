<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Interactiva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <main class="login-card registration-card">
        <div class="progress-bar">
            <div class="progress" id="progressLine"></div>
            <span class="step-indicator active">1</span>
            <span class="step-indicator">2</span>
            <span class="step-indicator">3</span>
        </div>

        <form id="multiStepForm">
            
            <div class="form-step step-active" id="step-1">
                <h2>¡Comencemos! 🚀</h2>
                <p class="step-subtitle">Crea tus credenciales de acceso.</p>
                
                <div class="form-group">
                    <label for="reg-name">Nombre Completo *</label>
                    <input type="text" id="reg-name" required placeholder="¿Cómo te llamas?">
                </div>
                <div class="form-group">
                    <label for="reg-email">Correo Electrónico *</label>
                    <input type="email" id="reg-email" required placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña *</label>
                    <input type="password" id="reg-password" required placeholder="Crea una clave segura">
                </div>
                
                <button type="button" class="btn-submit" onclick="nextStep(1)">Siguiente paso ✨</button>
            </div>

            <div class="form-step" id="step-2">
                <h2>Cuéntanos de ti 🏃‍♂️</h2>
                <p class="step-subtitle">Queremos conocer tu ritmo actual.</p>
                
                <div class="form-group">
                    <label for="reg-age">¿Qué edad tienes? *</label>
                    <input type="number" id="reg-age" min="12" max="99" required placeholder="Ej. 25">
                </div>
                
                <div class="form-group">
                    <label for="reg-sport">¿Practicas algún deporte actualmente?</label>
                    <input type="text" id="reg-sport" placeholder="Ej. Fútbol, Natación, Ninguno">
                </div>
                
                <div class="btn-group">
                    <button type="button" class="btn-secondary" onclick="prevStep(2)">Atrás</button>
                    <button type="button" class="btn-submit" onclick="nextStep(2)">¡Ya casi está! 🏁</button>
                </div>
            </div>

            <div class="form-step" id="step-3">
                <h2>Tus Metas 🎯</h2>
                <p class="step-subtitle">Personalicemos tu experiencia.</p>
                
                <div class="form-group">
                    <label for="reg-interest">¿Qué tipo de actividad te interesa?</label>
                    <select id="reg-interest">
                        <option value="cardio">Cardio / Resistencia</option>
                        <option value="fuerza">Fuerza / Musculación</option>
                        <option value="flexibilidad">Flexibilidad / Yoga / Pilates</option>
                        <option value="recreativo">Deporte Recreativo / Social</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>¿Cuál es tu objetivo principal? 🤔</label>
                    <div class="radio-tile-group">
                        <label class="radio-tile">
                            <input type="radio" name="goal" value="salud" checked>
                            <span>Salud y Bienestar</span>
                        </label>
                        <label class="radio-tile">
                            <input type="radio" name="goal" value="rendimiento">
                            <span>Mejorar Rendimiento</span>
                        </label>
                        <label class="radio-tile">
                            <input type="radio" name="goal" value="estetica">
                            <span>Tonificar / Bajar Peso</span>
                        </label>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn-secondary" onclick="prevStep(3)">Atrás</button>
                    <button type="submit" class="btn-submit btn-success">¡Registrarme! </button>
                </div>
            </div>

        </form>

        <footer class="login-footer">
            <p>¿Ya tienes cuenta? <a href="Login.html">Inicia sesión</a></p>
        </footer>
    </main>

    <script>
        function nextStep(current) {
            // Validación básica manual antes de pasar de hoja
            const inputs = document.getElementById(`step-${current}`).querySelectorAll('input[required]');
            let valid = true;
            inputs.forEach(input => { if(!input.value) valid = false; });
            
            if(valid) {
                document.getElementById(`step-${current}`).classList.remove('step-active');
                document.getElementById(`step-${current+1}`).classList.add('step-active');
                updateProgress(current + 1);
            } else {
                alert("Por favor, rellena los campos obligatorios (*)");
            }
        }

        function prevStep(current) {
            document.getElementById(`step-${current}`).classList.remove('step-active');
            document.getElementById(`step-${current-1}`).classList.add('step-active');
            updateProgress(current - 1);
        }

        function updateProgress(step) {
            const indicators = document.querySelectorAll('.step-indicator');
            indicators.forEach((ind, idx) => {
                if(idx < step) ind.classList.add('active');
                else ind.classList.remove('active');
            });
            document.getElementById('progressLine').style.width = ((step - 1) / 2 * 100) + '%';
        }

        // ==========================================
        // NUEVA LÓGICA: Redirección al terminar
        // ==========================================
        document.getElementById('multiStepForm').addEventListener('submit', function(event) {
            // 1. Evitamos que el formulario intente recargar la página
            event.preventDefault(); 
            
            // 2. Mostramos un mensaje amigable de éxito
            alert("¡Registro completado con éxito! Bienvenido a SportClub. Serás redirigido al inicio de sesión.");
            
            // 3. Redirigimos a la pantalla de Login
            window.location.href = "Login.html";
        });
    </script>
</body>
</html>
