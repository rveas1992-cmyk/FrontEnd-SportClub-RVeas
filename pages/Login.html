<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">

    <main class="login-card login-fade">
        <div class="logo-container">
            <img src="../assets/img/logo_empresa_letra_v1.png" alt="SportClub Logo" class="logo">
        </div>

        <form class="login-form" action="dashboard_usuario.html" method="GET">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu clave" required>
            </div>

            <div class="forgot-password">
                <a href="recuperacion.html">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>

        <footer class="login-footer">
            <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </footer>
        
        <footer class="volver-footer">
            <a href="../index.html">← Volver a la página principal</a>
        </footer>

        <div class="review-links">
            <p>Accesos de revisión docente:</p>
            <div>
                <a href="dashboard_coach.html" title="Rol Coach">Dashboard Coach</a>
                <a href="dashboard_admin.html" title="Rol Administrador">Dashboard Admin</a>
            </div>
        </div>
    </main>

</body>
</html>
