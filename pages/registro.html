<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Registro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">

    <main class="login-card registration-card">
        <div class="progress-bar">
            <div class="progress" id="progressLine"></div>
            <span class="step-indicator active" id="ind-1">1</span>
            <span class="step-indicator" id="ind-2">2</span>
            <span class="step-indicator" id="ind-3">3</span>
        </div>

        <div id="error-box" class="status-msg error" style="display: none;"></div>
        <div id="success-box" class="status-msg success" style="display: none;"></div>

        <form id="multiStepForm">
            <div class="form-step step-active" id="step-1">
                <h2>¡Comencemos! 🚀</h2>
                <p class="step-subtitle">Crea tus credenciales de acceso primarias.</p>
                
                <div class="form-group">
                    <label for="reg-name">Nombre Completo *</label>
                    <input type="text" id="reg-name" placeholder="Tu nombre y apellido">
                    <span id="err-name" style="color: #dc3545; font-size: 12px; display: none; margin-top: 4px;"></span>
                </div>
                <div class="form-group">
                    <label for="reg-email">Correo Electrónico *</label>
                    <input type="email" id="reg-email" placeholder="tu@correo.com">
                    <span id="err-email" style="color: #dc3545; font-size: 12px; display: none; margin-top: 4px;"></span>
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña *</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres">
                    <span id="err-password" style="color: #dc3545; font-size: 12px; display: none; margin-top: 4px;"></span>
                </div>
                <div class="form-group">
                    <label for="reg-confirm">Confirmar Contraseña *</label>
                    <input type="password" id="reg-confirm" placeholder="Repite tu contraseña">
                    <span id="err-confirm" style="color: #dc3545; font-size: 12px; display: none; margin-top: 4px;"></span>
                </div>
                
                <button type="button" class="btn-submit" onclick="handleNextStep(1)">Siguiente paso</button>
            </div>

            <div class="form-step" id="step-2">
                <h2>Cuéntanos de ti 🏃‍♂️</h2>
                <p class="step-subtitle">Queremos conocer tu ritmo actual.</p>
                
                <div class="form-group">
                    <label for="reg-age">¿Qué edad tienes? *</label>
                    <input type="number" id="reg-age" min="12" max="99" placeholder="Ej. 25">
                    <span id="err-age" style="color: #dc3545; font-size: 12px; display: none; margin-top: 4px;"></span>
                </div>
                <div class="form-group">
                    <label for="reg-sport">¿Deporte favorito o práctica actual?</label>
                    <input type="text" id="reg-sport" placeholder="Ej. Crossfit, Fútbol, Ninguno">
                </div>
                
                <div class="btn-group">
                    <button type="button" class="btn-secondary" onclick="handlePrevStep(2)">Atrás</button>
                    <button type="button" class="btn-submit" onclick="handleNextStep(2)">Continuar</button>
                </div>
            </div>

            <div class="form-step" id="step-3">
                <h2>Tus Metas 🎯</h2>
                <p class="step-subtitle">Estructura tus prioridades.</p>
                
                <div class="form-group">
                    <label for="reg-interest">Actividad de mayor interés</label>
                    <select id="reg-interest">
                        <option value="cardio">Cardio / Resistencia</option>
                        <option value="fuerza">Fuerza / Musculación</option>
                        <option value="flexibilidad">Flexibilidad / Yoga</option>
                    </select>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn-secondary" onclick="handlePrevStep(3)">Atrás</button>
                    <button type="submit" class="btn-submit">Finalizar Registro</button>
                </div>
            </div>
        </form>

        <footer class="login-footer">
            <p>¿Ya tienes cuenta? <a href="Login.html">Inicia sesión</a></p>
        </footer>
    </main>

    <script src="../js/registro.js"></script>
</body>
</html>
